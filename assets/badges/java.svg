<svg xmlns="http://www.w3.org/2000/svg" width="67" height="44" viewBox="0 0 67 44" role="img" aria-label="Java">
<title>Java</title>
<desc>Contrast 5.93:1 on both the light and dark GitHub canvas.</desc>
<defs>
<linearGradient id="bodyjava" x1="0" y1="3" x2="0" y2="39" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#e48f18"/><stop offset="1" stop-color="#cb7e13"/>
</linearGradient>
<linearGradient id="rimjava" x1="0" y1="3" x2="0" y2="39" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
<stop offset="0.3" stop-color="#ffffff" stop-opacity="0.04"/>
<stop offset="0.76" stop-color="#ffffff" stop-opacity="0.04"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
</linearGradient>
<linearGradient id="lensjava" x1="0" y1="0" x2="67" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
<stop offset="0.2687" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.7313" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
</linearGradient>
<filter id="castjava" x="-20%" y="-20%" width="140%" height="150%">

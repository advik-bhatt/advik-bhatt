</defs>
<g filter="url(#castjava)"><rect x="0" y="3" width="67" height="36" rx="18" fill="url(#bodyjava)" fill-opacity="0.94"/></g>
<g clip-path="url(#clipjava)">
<rect x="0" y="3" width="67" height="36" fill="url(#lensjava)"/>
<rect x="1.5" y="4.5" width="64" height="33" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
</g>
<rect x="0.5" y="3.5" width="66" height="35" rx="17.5" fill="none" stroke="url(#rimjava)" stroke-width="1"/>
<rect x="0.25" y="3.25" width="66.5" height="35.5" rx="17.75" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="0.5"/>
<text x="16" y="26.425" textLength="34.7" lengthAdjust="spacingAndGlyphs" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="590" letter-spacing="-0.15" fill="#141210">Java</text>

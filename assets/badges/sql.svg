<svg xmlns="http://www.w3.org/2000/svg" width="64" height="44" viewBox="0 0 64 44" role="img" aria-label="SQL">
<title>SQL</title>
<desc>Contrast 4.60:1 on both the light and dark GitHub canvas.</desc>
<defs>
<linearGradient id="bodysql" x1="0" y1="3" x2="0" y2="39" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#4679a0"/><stop offset="1" stop-color="#3a698d"/>
</linearGradient>
<linearGradient id="rimsql" x1="0" y1="3" x2="0" y2="39" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
<stop offset="0.3" stop-color="#ffffff" stop-opacity="0.05"/>
<stop offset="0.76" stop-color="#ffffff" stop-opacity="0.05"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
</linearGradient>
<linearGradient id="lenssql" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
<stop offset="0.2813" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.7188" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.09"/>
</linearGradient>
<filter id="castsql" x="-20%" y="-20%" width="140%" height="150%">

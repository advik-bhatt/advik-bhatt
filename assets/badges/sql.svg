<g filter="url(#castsql)"><rect x="0" y="3" width="64" height="36" rx="18" fill="url(#bodysql)" fill-opacity="0.94"/></g>
<g clip-path="url(#clipsql)">
<rect x="0" y="3" width="64" height="36" fill="url(#lenssql)"/>
<rect x="1.5" y="4.5" width="61" height="33" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
</g>
<rect x="0.5" y="3.5" width="63" height="35" rx="17.5" fill="none" stroke="url(#rimsql)" stroke-width="1"/>
<rect x="0.25" y="3.25" width="63.5" height="35.5" rx="17.75" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="0.5"/>
<text x="16" y="26.425" textLength="31.9" lengthAdjust="spacingAndGlyphs" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="590" letter-spacing="-0.15" fill="#ffffff">SQL</text>

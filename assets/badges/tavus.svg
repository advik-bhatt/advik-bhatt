<svg xmlns="http://www.w3.org/2000/svg" width="77" height="44" viewBox="0 0 77 44" role="img" aria-label="Tavus">
<title>Tavus</title>
<desc>Contrast 4.83:1 on both the light and dark GitHub canvas.</desc>
<defs>
<linearGradient id="bodytavus" x1="0" y1="3" x2="0" y2="39" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#785de6"/><stop offset="1" stop-color="#6040e5"/>
</linearGradient>
<linearGradient id="rimtavus" x1="0" y1="3" x2="0" y2="39" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
<stop offset="0.3" stop-color="#ffffff" stop-opacity="0.05"/>
<stop offset="0.76" stop-color="#ffffff" stop-opacity="0.05"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
</linearGradient>
<linearGradient id="lenstavus" x1="0" y1="0" x2="77" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
<stop offset="0.2338" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.7662" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.09"/>
</linearGradient>
<filter id="casttavus" x="-20%" y="-20%" width="140%" height="150%">
<feDropShadow dx="0" dy="0.8" stdDeviation="1" flood-color="#0a0f16" flood-opacity="0.16"/>
</filter>
<clipPath id="cliptavus"><rect x="0" y="3" width="77" height="36" rx="18"/></clipPath>
</defs>
<g filter="url(#casttavus)"><rect x="0" y="3" width="77" height="36" rx="18" fill="url(#bodytavus)" fill-opacity="0.94"/></g>
<g clip-path="url(#cliptavus)">
<rect x="0" y="3" width="77" height="36" fill="url(#lenstavus)"/>
<rect x="1.5" y="4.5" width="74" height="33" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
</g>
<rect x="0.5" y="3.5" width="76" height="35" rx="17.5" fill="none" stroke="url(#rimtavus)" stroke-width="1"/>
<rect x="0.25" y="3.25" width="76.5" height="35.5" rx="17.75" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="0.5"/>
<text x="16" y="26.425" textLength="44.9" lengthAdjust="spacingAndGlyphs" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="590" letter-spacing="-0.15" fill="#ffffff">Tavus</text>

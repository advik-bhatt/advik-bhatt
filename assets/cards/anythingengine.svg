<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" role="img" aria-label="Anything Engine, a search engine for agents that turns a goal for something that doesn't exist yet into an orderable build plan from real components">
  <defs><clipPath id="clip"><rect width="720" height="224" rx="16"/></clipPath></defs>
  <g clip-path="url(#clip)">
    <rect width="720" height="224" fill="#c2410c"/>
    <g opacity="0.09" fill="none" stroke="#ffffff" stroke-width="2.5">
      <circle cx="700" cy="24" r="150"/>
      <circle cx="700" cy="24" r="105"/>
      <circle cx="700" cy="24" r="60"/>
    </g>
  </g>
  <rect x="1" y="1" width="718" height="222" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="40" y="84" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#ffffff">Anything Engine</text>
  <text x="40" y="124" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#ffffff" fill-opacity="0.95">A search engine for things that don't exist yet.</text>
  <text x="40" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14.5" letter-spacing="0.3" fill="#ffffff" fill-opacity="0.74">Node.js / crates + npm + PyPI / Deterministic recipes</text>
  <text x="40" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" letter-spacing="0.4" fill="#ffffff" fill-opacity="0.92">View on GitHub  &#8594;</text>
</svg>
